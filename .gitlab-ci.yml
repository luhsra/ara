.scripts:
  git:
  - export GIT_CONFIG_GLOBAL=$PWD/ci_gitconfig
  - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "ssh://git@scm.sra.uni-hannover.de"
  - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://scm.sra.uni-hannover.de"
  clang:
  - export CC=clang CXX=clang++
  build-no-pch:
  - meson setup --native-file native-lab.ini $CI_JOB_NAME -Db_pch=false
  - meson compile -C $CI_JOB_NAME ara-py
  build-pch:
  - meson setup --native-file native-lab.ini $CI_JOB_NAME -Db_pch=true
  - meson compile -C $CI_JOB_NAME ara-py
  tests:
  - meson test -C $CI_JOB_NAME --suite ara-link --suite preproc --suite sse --suite sia

default:
  tags: ["test"]
  image: scm.sra.uni-hannover.de:5050/research/parrot
  interruptible: true

build-gcc:
  only: [soso, citest]
  script:
    - !reference [.scripts, git]
    - !reference [.scripts, build-pch]
  # run tests and upload results
    - !reference [.scripts, tests]
  artifacts:
    when: always
    paths:
    - $CI_JOB_NAME/meson-logs/testlog.txt

build-clang:
  only: [soso, citest]
  script:
    - !reference [.scripts, git]
    - !reference [.scripts, clang]
    - !reference [.scripts, build-pch]

build-gcc-no-pch:
  only: [soso, citest]
  script:
    - !reference [.scripts, git]
    - !reference [.scripts, build-no-pch]

build-clang-no-pch:
  only: [soso, citest]
  script:
    - !reference [.scripts, git]
    - !reference [.scripts, clang]
    - !reference [.scripts, build-no-pch]
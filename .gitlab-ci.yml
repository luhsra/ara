.git_config:
  script:
  - export GIT_CONFIG_GLOBAL=$PWD/ci_gitconfig
  - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "ssh://git@scm.sra.uni-hannover.de"
  - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://scm.sra.uni-hannover.de"

build-gcc-no-pch:
  tags: ["sra.labor", "Debian-12"]
  only: [soso, citest]
  interruptible: true
  variables:
    BUILD_DIR: './build-gcc-no-pch'
  script:
    - !reference [.git_config, script]
    - CC=gcc CXX=g++ meson setup --native-file native-lab.txt $BUILD_DIR -Db_pch=false
    - meson compile -C $BUILD_DIR ara-py

build-clang-no-pch:
  tags: ["sra.labor", "Debian-12"]
  only: [soso, citest]
  interruptible: true
  variables:
    BUILD_DIR: './build-clang-no-pch'
  script:
    - !reference [.git_config, script]
    - CC=clang CXX=clang++ meson setup --native-file native-lab.txt $BUILD_DIR -Db_pch=false
    - meson compile -C $BUILD_DIR ara-py

build-gcc:
  tags: ["sra.labor", "Debian-12"]
  only: [soso, citest]
  interruptible: true
  variables:
    BUILD_DIR: './build-gcc'
  script:
    - !reference [.git_config, script]
    - CC=gcc CXX=g++ meson setup --native-file native-lab.txt $BUILD_DIR -Db_pch=true -D execute_ara=true -D enable_arm=enabled -D toolchains:arm_cxx_dir=$(ls -d1 /usr/include/newlib/c++/* | head -n1)
    - meson compile -C $BUILD_DIR |& tee $BUILD_DIR/build.log

    - meson test -C $BUILD_DIR --suite ara-link
    - meson test -C $BUILD_DIR --suite preproc
    - meson test -C $BUILD_DIR --suite sse
    - meson test -C $BUILD_DIR --suite sia
  artifacts:
    when: always
    paths:
    - $BUILD_DIR/meson-logs/testlog.txt
    - $BUILD_DIR/build.log

build-clang:
  tags: ["sra.labor", "Debian-12"]
  only: [soso, citest]
  interruptible: true
  variables:
    BUILD_DIR: './build-clang'
  script:
    - !reference [.git_config, script]
    - CC=clang CXX=clang++ meson setup --native-file native-lab.txt $BUILD_DIR -Db_pch=true
    - meson compile -C $BUILD_DIR ara-py
